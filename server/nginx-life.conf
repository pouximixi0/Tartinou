# Tartinou — tartinou.pouximixi.fr (alias life.pouximixi.fr), TLS terminé par Caddy en amont.
# nginx sert les fichiers statiques ; /api/ est relayé vers le serveur Node (SQLite).
#   sudo cp server/nginx-life.conf /etc/nginx/sites-available/life && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name tartinou.pouximixi.fr life.pouximixi.fr;

    root /var/www/life;
    index index.html;
    charset utf-8;

    # Flux temps réel (SSE) : pas de mise en tampon, connexion longue.
    location = /api/events {
        proxy_pass http://127.0.0.1:3311;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header Cache-Control "no-store";
    }

    # Pages publiques (recettes partagées) : servies par le serveur Node.
    location /p/ {
        proxy_pass http://127.0.0.1:3311;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3311;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 10m;
        add_header Cache-Control "no-store";
    }

    # Jamais servis : code du serveur et base de données.
    location ~ ^/(server|data|node_modules)/ { return 404; }

    # Le service worker et la page d'entrée ne doivent jamais être mis en cache par le navigateur,
    # sinon les mises à jour (VERSION dans sw.js) ne sont pas détectées.
    location = /sw.js        { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /index.html   { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /manifest.json { types { } default_type application/manifest+json; add_header Cache-Control "no-cache"; }

    location ~* \.(js|css|png)$ { add_header Cache-Control "public, max-age=86400"; }

    location / { try_files $uri $uri/ /index.html; }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
}
