  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // Applique le thème choisi avant le premier rendu pour éviter un flash.
    try {
      var c = JSON.parse(localStorage.getItem('foyer:v2') || 'null');
      var t = c && c.state ? c.state.settings : JSON.parse(localStorage.getItem('foyer:v1') || '{}').settings;
      if (t && (t.theme === 'dark' || t.theme === 'light')) document.documentElement.dataset.theme = t.theme;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
